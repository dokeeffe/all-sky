[project]
name = "allsky-camera"
version = "0.1.0"
description = "A lightweight all-sky camera capture service"
requires-python = ">=3.11"
dependencies = [
    "astropy>=6",
    "boto3>=1.35",
    "numpy>=2.0",
    "photutils>=2",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
allsky-camera = "allsky_app.__main__:main"

[tool.setuptools.packages.find]
include = ["allsky_app*"]
